<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rule Converter - Adblock to Clash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .format-selectors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-section {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .result-section.show {
            display: block;
        }

        .stats {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .stats h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            color: #666;
            font-size: 14px;
        }

        .stat-value {
            font-weight: 600;
            color: #667eea;
        }

        .output-box {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .secondary-button {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .secondary-button:hover:not(:disabled) {
            background: #f8f9ff;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
            display: none;
        }

        .error.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .format-selectors,
            .button-group {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Rule Converter</h1>
        <p class="subtitle">Convert Adblock rules to Clash ruleset format</p>

        <div class="error" id="errorMessage"></div>

        <form id="converterForm">
            <div class="form-group">
                <label for="url">Rule Source URL</label>
                <input 
                    type="text" 
                    id="url" 
                    name="url" 
                    placeholder="https://example.com/rules.txt or domain.com/rules.txt"
                    required
                >
            </div>

            <div class="format-selectors">
                <div class="form-group">
                    <label for="inputFormat">Input Format</label>
                    <select id="inputFormat" name="inputFormat">
                        {% for format in input_formats %}
                        <option value="{{ format }}">{{ format|capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="outputFormat">Output Format</label>
                    <select id="outputFormat" name="outputFormat">
                        {% for format in output_formats %}
                        <option value="{{ format }}">
                            {% if format == 'clash-domain-suffix' %}
                                Clash - DOMAIN-SUFFIX
                            {% elif format == 'clash-domain' %}
                                Clash - DOMAIN
                            {% elif format == 'clash-domain-keyword' %}
                                Clash - DOMAIN-KEYWORD
                            {% else %}
                                {{ format|upper }}
                            {% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <button type="submit" id="convertButton">Convert Rules</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Converting rules, please wait...</p>
        </div>

        <div class="result-section" id="resultSection">
            <div class="stats">
                <h3>📊 Conversion Statistics</h3>
                <div class="stat-item">
                    <span>Total Domains:</span>
                    <span class="stat-value" id="totalDomains">-</span>
                </div>
                <div class="stat-item">
                    <span>Input Format:</span>
                    <span class="stat-value" id="statInputFormat">-</span>
                </div>
                <div class="stat-item">
                    <span>Output Format:</span>
                    <span class="stat-value" id="statOutputFormat">-</span>
                </div>
                <div class="stat-item">
                    <span>Source URL:</span>
                    <span class="stat-value" id="sourceUrl" style="word-break: break-all;">-</span>
                </div>
            </div>

            <div class="output-box" id="outputBox"></div>

            <div class="button-group">
                <button type="button" class="secondary-button" id="copyButton">📋 Copy to Clipboard</button>
                <button type="button" id="downloadButton">⬇️ Download File</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('converterForm');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('resultSection');
        const errorMessage = document.getElementById('errorMessage');
        const convertButton = document.getElementById('convertButton');
        
        let currentContent = '';
        let currentOutputFormat = '';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Hide previous results and errors
            resultSection.classList.remove('show');
            errorMessage.classList.remove('show');
            loading.classList.add('show');
            convertButton.disabled = true;

            const formData = {
                url: document.getElementById('url').value,
                input_format: document.getElementById('inputFormat').value,
                output_format: document.getElementById('outputFormat').value
            };

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Conversion failed');
                }

                // Store current content
                currentContent = data.content;
                currentOutputFormat = formData.output_format;

                // Update stats
                document.getElementById('totalDomains').textContent = data.stats.total_domains.toLocaleString();
                document.getElementById('statInputFormat').textContent = data.stats.input_format.toUpperCase();
                document.getElementById('statOutputFormat').textContent = data.stats.output_format.toUpperCase();
                document.getElementById('sourceUrl').textContent = data.stats.source_url;

                // Display output
                document.getElementById('outputBox').textContent = data.content;

                // Show results
                loading.classList.remove('show');
                resultSection.classList.add('show');

            } catch (error) {
                loading.classList.remove('show');
                errorMessage.textContent = '❌ Error: ' + error.message;
                errorMessage.classList.add('show');
            } finally {
                convertButton.disabled = false;
            }
        });

        // Copy to clipboard
        document.getElementById('copyButton').addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(currentContent);
                const button = document.getElementById('copyButton');
                const originalText = button.textContent;
                button.textContent = '✅ Copied!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            } catch (error) {
                alert('Failed to copy to clipboard');
            }
        });

        // Download file
        document.getElementById('downloadButton').addEventListener('click', async () => {
            try {
                const blob = new Blob([currentContent], { type: 'text/yaml' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentOutputFormat === 'clash' ? 'converted_rules.yaml' : 'converted_rules.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                alert('Failed to download file');
            }
        });
    </script>
</body>
</html>
